<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <!-- ── iOS PWA meta ──────────────────────────────────────────
       viewport-fit=cover：頁面延伸至瀏海/home bar 區域（safe-area 補回）
       apple-mobile-web-app-capable：允許加入主畫面以全螢幕啟動
       apple-mobile-web-app-status-bar-style：default = 不透明黑字（Task8 淺色主題）
         → default 下 safe-area-inset-top 歸 0，全站 env() 回退 0px 模式安全
  ──────────────────────────────────────────────────────────── -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="東京行">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <!-- ── PWA manifest & theme ─────────────────────────────── -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#F5F6F8">   <!-- Task8 淺色主題，與 --c-bg / manifest 三處一致 -->

  <title>東京自由行</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- ──────────────────────────────────────────────────────────
    分頁容器（A1 DOM 約定）
      id="tab-{id}"  ← app.js showTab() 依此 id 控制 hidden
      每個 section 直接作為各功能模組的掛載容器
      各分頁 DOM 均由對應 JS 動態建構，section 本體留空
  ─────────────────────────────────────────────────────────── -->

  <!-- 常用句（Task2 實作）-->
  <section id="tab-phrases" class="tab-section"></section>

  <!-- 翻譯（Task5 實作）-->
  <section id="tab-translate" class="tab-section" hidden></section>

  <!-- 拍照（Task6 實作）— DOM 由 camera-tab.js 動態建構 -->
  <section id="tab-camera" class="tab-section" hidden></section>

  <!-- 行程（Task3 實作）-->
  <section id="tab-trip" class="tab-section" hidden></section>

  <!-- 地圖（Task17 實作）— DOM 由 map-tab.js 動態建構 -->
  <section id="tab-map" class="tab-section" hidden></section>

  <!-- 折價券（Task4 實作）-->
  <section id="tab-coupons" class="tab-section" hidden></section>

  <!-- ──────────────────────────────────────────────────────────
    底部分頁導覽列
      A1：data-tab="{id}"  ← app.js DOMContentLoaded 時綁定點擊
      A7：z-index:10（style.css 定義；overlay 須 ≥100）
      safe-area-inset-bottom 由 style.css 處理（iOS home bar）
  ─────────────────────────────────────────────────────────── -->
  <nav id="nav-bar" role="tablist" aria-label="主導覽">

    <button class="nav-btn active" data-tab="phrases"
            role="tab" aria-selected="true" aria-controls="tab-phrases">
      <span class="nav-icon" aria-hidden="true">💬</span>
      <span class="nav-label">常用句</span>
    </button>

    <button class="nav-btn" data-tab="translate"
            role="tab" aria-selected="false" aria-controls="tab-translate">
      <span class="nav-icon" aria-hidden="true">🌐</span>
      <span class="nav-label">翻譯</span>
    </button>

    <button class="nav-btn" data-tab="camera"
            role="tab" aria-selected="false" aria-controls="tab-camera">
      <span class="nav-icon" aria-hidden="true">📷</span>
      <span class="nav-label">拍照</span>
    </button>

    <button class="nav-btn" data-tab="trip"
            role="tab" aria-selected="false" aria-controls="tab-trip">
      <span class="nav-icon" aria-hidden="true">🗺️</span>
      <span class="nav-label">行程</span>
    </button>

    <button class="nav-btn" data-tab="map"
            role="tab" aria-selected="false" aria-controls="tab-map">
      <span class="nav-icon" aria-hidden="true">🗺</span>
      <span class="nav-label">地圖</span>
    </button>

    <button class="nav-btn" data-tab="coupons"
            role="tab" aria-selected="false" aria-controls="tab-coupons">
      <span class="nav-icon" aria-hidden="true">🎫</span>
      <span class="nav-label">折價券</span>
    </button>

  </nav>

  <!-- Task14 — 版號徽章（文字由 app.js 填；HTML 不寫死版號）-->
  <div id="app-version"></div>

  <!-- Task14 — 更新提示（顯示/隱藏與 click handler 由 app.js 控）-->
  <button id="update-toast" hidden>有新版本，點一下更新</button>

  <!-- ──────────────────────────────────────────────────────────
    腳本載入順序（A6 — Task14 修訂定死）
      version.js：版本常數（Task14 起，最前無依賴，APP_VERSION/APP_VERSION_DATE）
      config.js：onerror 容錯（A4）— window.APP_CONFIG 可能未定義
      phrases.js / tripdata.js / mapdata.js：資料層，必須在 app.js 之前
      app.js：分頁框架 + App API + SW 註冊
      功能模組：app.js 之後插入，可直接同步呼叫 App.registerTab()
        wrap 鏈外→內：coupon-viewer → camera-tab → translate-tab → bigtext → app.js
        map-tab.js 不 wrap（無錄音/TTS/overlay），插 trip-tab.js 之後
  ─────────────────────────────────────────────────────────── -->
  <script src="./js/version.js"></script>
  <script src="./js/config.js" onerror="window._configLoadError=true"></script>
  <script src="./js/phrases.js"></script>
  <script src="./js/tripdata.js"></script>
  <script src="./js/mapdata.js"></script>
  <script src="./js/app.js"></script>
  <!-- Task2 功能模組（順序定死：tts 在最前，phrases-tab 在最後，皆在 app.js 之後）-->
  <script src="./js/tts.js"></script>
  <script src="./js/bigtext.js"></script>
  <script src="./js/phrases-tab.js"></script>
  <!-- Task3 功能模組（順序定死：import-data 必須在 trip-tab 之前）-->
  <script src="./js/import-data.js"></script>
  <script src="./js/trip-tab.js"></script>
  <!-- Task17 地圖分頁（mapdata.js 在資料層已載；不 wrap showTab）-->
  <script src="./js/map-tab.js"></script>
  <!-- Task5 功能模組（api 在 translate-tab 之前；皆在 tts/bigtext 之後）-->
  <script src="./js/api.js"></script>
  <!-- Task12 錄音封裝（api.js 之後、translate-tab.js 之前）-->
  <script src="./js/recorder.js"></script>
  <script src="./js/translate-tab.js"></script>
  <!-- Task6 OCR 分頁（translate-tab 之後，coupon-viewer 之前；wrap 鏈第四層）-->
  <script src="./js/camera-tab.js"></script>
  <!-- Task4 功能模組（coupon-viewer 須在 coupons-tab 之前，O1 wrap 依賴）-->
  <script src="./js/coupon-viewer.js"></script>
  <script src="./js/coupons-tab.js"></script>

</body>
</html>
